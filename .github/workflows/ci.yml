name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      force_heavy:
        description: Run the macOS and Windows build jobs regardless of changed paths
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: EsionHsrahLatigid/yup-actions/.github/workflows/plugin-ci.yml@83c2b82cde8050bcb12acce1c24b2aa18da9f1bd
    with:
      product_name: BlackThrum
      product_slug: blackthrum
      cmake_option_prefix: BLACKTHRUM
      debug_targets_json: '["blackthrum_engine_tests"]'
      release_test_targets_json: '["blackthrum_engine_tests","blackthrum_plugin_bridge_tests"]'
      windows_debug_plugins: false
      force_heavy: ${{ inputs.force_heavy }}
